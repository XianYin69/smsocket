# SMSocket v0.3 - copy to config.yaml and fill in your keys.
# Secrets stay out of the file: ${ENV_VAR} is expanded from the environment.

listen: 127.0.0.1:8000          # host:port the gateway binds
master_keys:                    # client-facing keys ("sk-socket-..."); empty = no auth
                                  # (empty + no env -> a random key is minted into smsocket.key)
  - ${SMSSOCKET_MASTER_KEY}     # or the literal key; empty master_keys -> smsocket.key is minted
strategy: priority              # priority | round_robin | weighted
cooldown: 60                    # seconds a failing key is skipped
db_path: usage.sqlite3          # call log for /stats + /v1/usage + dashboard
currency: USD                   # legacy alias of billing.currency (billing: wins when present)

# ---- v0.3: billing currency + exchange rates ------------------------------
billing:
  currency: CNY                   # every total (/stats, /v1/usage, dashboard) shows in this
  base: USD                       # rates below are "units of <currency> per 1 <base>"
  precision: 6
  rates_url: ""                   # optional: POST /admin/billing/rates/refresh pulls a table
  rates:
    USD: 1
    CNY: 7.1
    EUR: 0.92
    GBP: 0.78
    JPY: 155
    KRW: 1350

# ---- v0.3: concurrency (admission gate + live meter) ----------------------
max_concurrency: 0                # 0 = unlimited simultaneous upstream calls
queue_wait: 30                    # seconds a caller may wait for a free slot, then 429
per_provider_concurrency: 0       # 0 = no per-provider cap (GET /concurrency to watch)

# ---- v0.3: parallel batch / async jobs ------------------------------------
# POST /v1/batch {"requests":[{model,messages,...}], "concurrency":8, "fail_fast":false}
# POST /v1/batch?async=1 -> 202 {"job":"job_x"} ; GET /v1/batches/{job}?wait=5 ; DELETE to cancel

# ---- v0.3: discovery ------------------------------------------------------
# POST /admin/discover {"providers":["openai"],"probe_params":true,"async":1}
# GET /admin/discover/status ; GET /admin/models (cached catalog) ;
# POST /admin/models/apply {"providers":["openai"]} -> publishes probed ids as new aliases
#                                       (add-only: an existing alias is never overwritten)

pricing:                          # per 1M tokens; `currency:` per row = what the vendor bills in
  '*': {prompt: 0.15, completion: 0.60}     # fallback row for unlisted aliases
  gpt-4o-mini: {prompt: 0.15, completion: 0.60, currency: USD}
  claude-3-5-sonnet: {prompt: 3.00, completion: 15.00, currency: USD}
  deepseek-chat: {prompt: 0.27, completion: 1.10, currency: CNY}
log_level: INFO

# ---- v0.6: DSM v1 envelope (additive layer, off by default) -------------------
# enabled=false -> /v1/dsm/* answers 404 and nothing about /v1/chat/completions changes.
# enabled=false AND openai_compat=false is refused at load (both roads closed = no gateway).
dsm:
  enabled: false                    # serve POST /v1/dsm/chat + /v1/dsm/schema + /v1/dsm/fan
  openai_compat: true               # false -> legacy endpoints answer 410 (loud, never silent)
  schema_store: runtime/dsm_schemas.json   # ref -> {system, tools}; session store sits beside it
  max_materialize_bytes: 2000000    # materialised body above this -> 413
  budget_map: {low: 1024, mid: 4096, high: 16384}   # server-side thinking tiers
  require_registered_schema: false  # true -> refuse chat when sch was never registered

egc:                                  # EGC v1 出站标准层（egc.py·规范_出站精简_EGC_v1.md）
  # 位置：DSM 信封物化之后、序列化之前——出网的最后一道。默认档只开「实测零语义
  # 损失」的开关；enabled: false 一行回到旧行为（出网字节与接它之前逐字节相同）。
  enabled: true
  budget_ms: 5                        # 毫秒门：转换 p95 必须 <= 它（实测 0.2~0.7ms）
  validate: true                      # 出网前机检；不过则退回未精简 body（宁可不省也不发 400）
  # ff: {R3a_drop_fn_desc: true}      # 有语义代价的开关，按 lane 显式打开
  # lane_tools:                       # R4：按 lane 只带真用的工具（实测 17→6 省 37.5% token）
  #   "*": [read, grep, exec]
  #   conv: [read, write, chain]

providers:
  - name: openai
    base_url: https://api.openai.com/v1
    keys:
      - ${OPENAI_API_KEY}
      # - ${OPENAI_API_KEY_2}     # add more keys -> automatic rotation + 401/429 cooldown
    models:                      # public alias: upstream model id
      gpt-4o-mini: gpt-4o-mini
      gpt-4o: gpt-4o
    priority: 10                 # preferred provider
    weight: 3                    # used by strategy=weighted
    timeout: 120
    max_rpm: 0                   # 0 = unlimited; per-slot requests/minute cap
    embeddings:                  # optional: serve POST /v1/embeddings from this provider
      my-embeddings: text-embedding-3-small

- name: openai-compatible      # any OpenAI-shaped endpoint (DeepSeek, Moonshot, vLLM...)
     base_url: https://api.deepseek.com/v1
     keys:
       - ${DEEPSEEK_API_KEY}
     models:
       deepseek-chat: deepseek-chat
     priority: 5

   - name: opencode                # OpenCode AI Gateway · OpenAI-compatible（chat/completions）
     base_url: https://opencode.ai/inference/openai/v1
     style: openai
     keys:
       - ${OPENCODE_API_KEY}          # 控制台 → Keys → Add Service Account 生成（oc_sk-*）
     keyless: true                  # 免费模型与 /v1/models 无需 Key；留空 keys 也照常探测
     # models: 留空或写通配 `*` → 网关通过 /v1/models 实时取模型（自动探测）
     priority: 8

   - name: kilocode               # Kilocode AI Gateway · OpenAI-compatible
     base_url: https://api.kilo.ai/api/gateway/v1
     style: openai
     keys:
       - ${KILOCODE_API_KEY}         # 控制台 → API Keys 生成
     models:
       kilo/auto: kilo/auto          # 默认模型；其它 kilocode/<id> 按需追加
     priority: 6

  - name: anthropic              # native Anthropic API, exposed as OpenAI chat format
    base_url: https://api.anthropic.com
    style: anthropic
    keys:
      - ${ANTHROPIC_API_KEY}
    models:
      claude-3-5-sonnet: claude-3-5-sonnet-latest
    extra_headers:
      anthropic-version: "2023-06-01"
    priority: 1

  - name: fallback               # same alias served elsewhere -> automatic failover
    base_url: https://api.openai.com/v1
    keys:
      - ${OPENAI_BACKUP_KEY}
    models:
      gpt-4o-mini: gpt-4o-mini
    enabled: false               # flip to true to activate

# ---- v0.4 net plane (optional, OFF by default) ---------------------------
# Route upstream calls through an smsc/clash external-controller (UI label: SMSC,
# under 总设置 → 扩展程序): score every egress
# path (direct vs. proxy/node) and send each provider through the best one.
# Operator surface is /internal/net/* - deliberately absent from OpenAPI/docs.
clash:
  enabled: false                   # true = build the net plane at startup
  controller: http://127.0.0.1:9090   # clash external-controller (mixed api port)
  secret: ${CLASH_SECRET}          # external-controller secret, keep in the env
  mixed_port: 7890                 # clash mixed-port -> http://<controller-host>:7890
  # proxy_url: http://127.0.0.1:7890   # set to override the mixed_port guess
  health_url: https://www.google.com/generate_204
  timeout: 5                       # seconds per controller call / probe
  interval: 60                     # seconds between background re-probes
  mode: auto                       # auto | direct | proxy (force one plane)
  groups: [PROXY-GRP]              # proxy-provider groups to track and score
  provider_proxy:                  # static hint: provider -> group or group/node
    openai: PROXY-GRP
    anthropic: PROXY-GRP/us-east-2
  smart: true                      # rank egress by measured delay + fail ratio
  min_delay_ms: 20                 # a proxy must beat direct by this much to win
  fail_ratio: 0.5                  # above this a path counts as unhealthy

# ---- v0.4 stack scheduler (optional, OFF by default) ----------------------
# Instead of refusing a request the moment a limit bites, park it on a stack
# and wake it as soon as capacity frees up. Disabled = today's behaviour:
# saturated caller -> immediate 429.
stack:
  enabled: false                   # true = park instead of refusing
  max_depth: 1000                  # parked callers at once, then 429 anyway
  wait: 120                        # seconds one caller accepts being parked
  policy: lifo                     # lifo | fifo | priority
  park_on: [saturated, rpm, provider_saturated]   # which limits may park
  interval: 0.25                   # drain poll (seconds)
  repark: 3                        # batch items: re-parks after a 429

# ---- v0.4 model + reachability assessment (optional, OFF by default) ------
# Two sources feed one table: `live` mirrors the traffic you already serve
# (free, no extra calls), `probe` really calls each model over each egress
# path so you learn whether a model is reachable from *this* network at all.
assess:
  enabled: false                   # true = mirror live calls + schedule sweeps
  interval_s: 3600                 # hours between scheduled sweeps
  at: ""                           # "HH:MM" daily slot (empty = interval only)
  models: []                       # empty = every published alias
  providers: []                    # empty = every provider
  egress: auto                     # auto = direct + every clash path, or one id
  prompt: "Reply with exactly one word: ok"
  max_tokens: 8                    # probes stay tiny on purpose
  concurrency: 4                   # parallel probes
  timeout: 20                      # seconds per probe before it counts as failed
  live: true                       # harvest from real traffic
  live_sample: 1.0                 # 0..1 share of live calls recorded
  slow_ms: 8000                    # p50 above this = verdict "slow"
  window_s: 86400                  # report window (default: last 24h)

# ---- v0.5 console + automation -------------------------------------------
ui:
  skin: a                          # console theme a|b|c|d, saved on the server
                                   # (a new browser or a private window keeps it)

discover:
  on_add: true                     # adding a provider probes it by itself
  apply_aliases: true              # ...and publishes the models it found
  auto_assess: true                # ...and measures them right away
  concurrency: 8
  timeout: 30
  probe_params: true               # temperature/tools/response_format support
  probe_stream: true
  max_models: 200
  fresh_seconds: 900              # 控制台进「提供商与大模型」时，超过此时长未探测的提供商自动补探

tune:
  enabled: true                    # weight/priority come from measurement
  interval_s: 600                  # re-rank every 10 minutes
  window_s: 86400                  # from the last 24h of traffic + probes
  min_samples: 3                   # thinner evidence is shrunk toward neutral
  persist: false                   # true = also write the numbers into this file
  priority_spread: 10
  weight_spread: 10

extensions:                        # 总设置 → 扩展程序：已导入的扩展程序 bundle（由界面写入）
  - name: smsc                     # asset/extension.json 里的 name
    title: SMSC 网络平面面板
    path: C:/UserSpace/EthanYan/Developin/smsc
    panel: panel.html              # 相对 bundle 的 asset/ 目录，不许越界
    version: "1.0"
    verified: true                 # 只是备忘：每次读取都按 asset/SMSocket.identity 重算
